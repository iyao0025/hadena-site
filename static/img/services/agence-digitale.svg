  <circle cx="125" cy="50" r="4" fill="#304B9B" opacity="0.4"/>
  <!-- Sparkle accents -->
  <path d="M160 40 L162 45 L167 47 L162 49 L160 54 L158 49 L153 47 L158 45 Z" fill="#F59E0B"/>
  <path d="M40 40 L41 43 L44 44 L41 45 L40 48 L39 45 L36 44 L39 43 Z" fill="#F59E0B" opacity="0.6"/>
</svg>
