<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Agence Web & Digitale - Globe/Design -->
  <!-- Globe -->
  <circle cx="100" cy="90" r="55" fill="none" stroke="#304B9B" stroke-width="2.5"/>
  <ellipse cx="100" cy="90" rx="30" ry="55" fill="none" stroke="#304B9B" stroke-width="1.5"/>
  <ellipse cx="100" cy="90" rx="12" ry="55" fill="none" stroke="#304B9B" stroke-width="1" opacity="0.5"/>
  <!-- Latitude lines -->
  <ellipse cx="100" cy="65" rx="52" ry="8" fill="none" stroke="#304B9B" stroke-width="1" opacity="0.5"/>
  <line x1="45" y1="90" x2="155" y2="90" stroke="#304B9B" stroke-width="1" opacity="0.5"/>
  <ellipse cx="100" cy="115" rx="52" ry="8" fill="none" stroke="#304B9B" stroke-width="1" opacity="0.5"/>
  <!-- Globe fill accent -->
  <circle cx="100" cy="90" r="55" fill="#304B9B" opacity="0.06"/>
