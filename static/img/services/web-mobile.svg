<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Applications Web & Mobile - Devices/Code -->
  <!-- Laptop/Monitor -->
  <rect x="20" y="40" width="115" height="80" rx="6" fill="#304B9B"/>
  <rect x="26" y="46" width="103" height="62" rx="2" fill="white"/>
  <!-- Code on screen -->
  <rect x="32" y="52" width="35" height="3" rx="1" fill="#304B9B" opacity="0.6"/>
  <rect x="38" y="59" width="50" height="3" rx="1" fill="#F59E0B" opacity="0.7"/>
  <rect x="38" y="66" width="40" height="3" rx="1" fill="#423E3C" opacity="0.5"/>
  <rect x="44" y="73" width="55" height="3" rx="1" fill="#304B9B" opacity="0.4"/>
  <rect x="44" y="80" width="30" height="3" rx="1" fill="#F59E0B" opacity="0.5"/>
  <rect x="38" y="87" width="45" height="3" rx="1" fill="#423E3C" opacity="0.4"/>
  <rect x="32" y="94" width="25" height="3" rx="1" fill="#304B9B" opacity="0.5"/>
  <!-- Laptop base -->
  <path d="M10 120 L20 114 L135 114 L145 120 Z" fill="#423E3C"/>
  <!-- Mobile phone -->
  <rect x="140" y="55" width="45" height="85" rx="6" fill="#423E3C"/>
  <rect x="145" y="65" width="35" height="60" rx="2" fill="white"/>
  <!-- Phone content -->
  <rect x="150" y="70" width="25" height="4" rx="1" fill="#304B9B" opacity="0.6"/>
  <rect x="150" y="78" width="15" height="15" rx="2" fill="#304B9B" opacity="0.2"/>
  <rect x="168" y="78" width="8" height="15" rx="2" fill="#F59E0B" opacity="0.3"/>
  <rect x="150" y="97" width="25" height="3" rx="1" fill="#423E3C" opacity="0.3"/>
  <rect x="150" y="103" width="25" height="3" rx="1" fill="#423E3C" opacity="0.3"/>
  <rect x="150" y="109" width="18" height="3" rx="1" fill="#423E3C" opacity="0.3"/>
  <!-- Phone notch -->
  <rect x="155" y="58" width="20" height="3" rx="1.5" fill="white" opacity="0.3"/>
  <!-- Phone home button -->
  <circle cx="162" cy="135" r="3" stroke="white" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Code brackets -->
  <text x="60" y="170" font-family="monospace" font-size="28" fill="#304B9B" opacity="0.7">&lt;/&gt;</text>
  <!-- Connection dots -->
  <circle cx="135" cy="95" r="3" fill="#F59E0B"/>
  <line x1="135" y1="95" x2="145" y2="95" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>
