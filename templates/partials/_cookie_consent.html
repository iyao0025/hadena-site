<!-- Partial: Bannière de Consentement Cookies (RGPD) -->
{% if not COOKIE_CONSENT %}
<div id="cookie-consent-banner" class="fixed bottom-4 left-4 right-4 md:left-auto md:right-6 md:max-w-md bg-slate-900/95 backdrop-blur-xl text-white p-5 rounded-2xl shadow-2xl border border-slate-800 z-50 transition-all duration-300">
  <div class="flex items-start gap-3.5 mb-3">
    <div class="w-8 h-8 rounded-lg bg-primary/20 text-sky-400 flex items-center justify-center shrink-0 mt-0.5">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>
    <div>
      <h2 class="text-sm font-extrabold text-white">Respect de votre vie privée</h2>
      <p class="text-xs text-slate-300 leading-relaxed mt-1">
        Nous utilisons des cookies strictement techniques pour assurer la sécurité et le bon fonctionnement du site web, conformément à la loi ivoirienne n° 2013-450 et au RGPD.
      </p>
    </div>
  </div>

  <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-3 border-t border-slate-800/80">
    <a href="{% url 'showcase:mentions_legales' %}#cookies" class="text-xs text-slate-400 hover:text-sky-300 underline underline-offset-2 transition-colors self-start sm:self-auto">
      Politique de cookies
    </a>

    <div class="grid grid-cols-2 gap-2 sm:flex sm:items-center">
      <!-- Bouton Refuser (Poids visuel égal RGPD) -->
      <button type="button" onclick="setHadenaCookieConsent('rejected')" class="btn btn-sm h-9 min-h-[36px] px-4 rounded-xl border border-slate-700 bg-slate-800/90 hover:bg-slate-700 text-slate-200 font-bold transition-all text-xs">
        Refuser
      </button>

      <!-- Bouton Accepter (Poids visuel égal RGPD) -->
      <button type="button" onclick="setHadenaCookieConsent('accepted')" class="btn btn-sm h-9 min-h-[36px] px-4 rounded-xl btn-primary text-white font-bold shadow-md shadow-primary/20 transition-all text-xs">
        Accepter
      </button>
    </div>
  </div>
</div>

<script>
  function setHadenaCookieConsent(choice) {
    // 1. Stocker immédiatement le consentement dans le cookie navigateur
    var maxAge = 365 * 24 * 3600;
    document.cookie = "hadena_cookie_consent=" + encodeURIComponent(choice) + "; path=/; max-age=" + maxAge + "; SameSite=Lax";

    // 2. Notifier discrètement le serveur en arrière-plan sans bloquer
    try {
      fetch("{% url 'showcase:set_cookie_consent' %}?consent=" + encodeURIComponent(choice), {
        method: "GET",
        headers: { "X-Requested-With": "XMLHttpRequest" }
      }).catch(function() {});
    } catch(e) {}

    // 3. Masquer immédiatement le bandeau avec une animation fluide
    var banner = document.getElementById("cookie-consent-banner");
    if (banner) {
      banner.style.opacity = "0";
      banner.style.transform = "translateY(20px)";
      setTimeout(function() {
        banner.remove();
      }, 300);
    }
  }
</script>
{% endif %}
