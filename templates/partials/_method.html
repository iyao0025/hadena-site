<!-- Partial: Notre Méthode en 4 Étapes -->
<section class="py-20 lg:py-28 bg-base-100 border-t border-slate-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- En-tête -->
    <div class="text-center max-w-3xl mx-auto mb-16 sm:mb-20">
      <span class="text-xs font-black tracking-widest text-primary uppercase inline-block mb-3">
        Notre méthode
      </span>
      <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
        Une démarche claire, du diagnostic au suivi
      </h2>
    </div>

    <!-- Frise en 4 étapes -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 relative">
      
      <!-- Ligne de liaison horizontale (visible desktop) -->
      <div class="hidden lg:block absolute top-7 left-14 right-14 h-0.5 bg-slate-200 z-0"></div>

      {% for step in steps %}
      <div class="flex flex-col items-center text-center relative z-10 group">
        <!-- Rond numéroté -->
        <div class="w-14 h-14 rounded-full bg-white border-2 border-primary text-primary font-black text-lg flex items-center justify-center mb-6 shadow-md group-hover:bg-primary group-hover:text-white transition-colors duration-200">
          {{ step.step }}
        </div>
        <!-- Titre -->
        <h3 class="text-lg font-bold text-slate-900 mb-2">
          {{ step.title }}
        </h3>
        <!-- Description -->
        <p class="text-xs sm:text-sm text-slate-600 leading-relaxed max-w-xs">
          {{ step.description }}
        </p>
      </div>
      {% endfor %}

    </div>

  </div>
</section>
